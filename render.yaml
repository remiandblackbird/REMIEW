services:
  - type: web
    name: remiew-label-review
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5
      - key: CLAUDE_EFFORT
        value: medium
